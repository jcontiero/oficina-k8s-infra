name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_cloud_apply:
        description: "Digite 'true' para autorizar o terraform apply na plataforma compartilhada (GCP)"
        required: true
        default: "false"
      apply_scope:
        description: "Escopo do plano da plataforma compartilhada"
        type: choice
        required: true
        default: datadog
        options:
          - datadog
          - gke_capacity

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-k8s-infra-shared
  cancel-in-progress: false

jobs:
  plan:
    name: Platform Plan and Apply
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/936717667971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@fiap-project-514922.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Plan
        env:
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
          APPLY_SCOPE: ${{ inputs.apply_scope }}
        run: |
          if [[ "$APPLY_SCOPE" == "datadog" ]]; then
            terraform plan -input=false -var-file="environments/main.tfvars" -target=module.datadog -out=/tmp/platform.tfplan
          else
            terraform plan -input=false -var-file="environments/main.tfvars" -target=module.gke.google_container_node_pool.primary_nodes -out=/tmp/platform.tfplan
          fi
        working-directory: infra

      - name: Verify limited scope
        env:
          APPLY_SCOPE: ${{ inputs.apply_scope }}
        working-directory: infra
        run: |
          terraform show -json /tmp/platform.tfplan > /tmp/platform-plan.json
          python - <<'PYTHON'
          import json
          import os
          with open('/tmp/platform-plan.json') as source:
              changes = json.load(source).get('resource_changes', [])
          scope = os.environ['APPLY_SCOPE']
          for change in changes:
              actions = change['change']['actions']
              if actions in [['no-op'], ['read']]:
                  continue
              address = change['address']
              if scope == 'datadog':
                  in_scope = address.startswith('module.datadog.')
              else:
                  in_scope = address == 'module.gke.google_container_node_pool.primary_nodes'
              if not in_scope or 'delete' in actions:
                  raise SystemExit(f'Alteração fora do escopo: {address} {actions}')
              print(address, actions)
          PYTHON
      - name: Apply exact saved Datadog plan
        if: inputs.confirm_cloud_apply == 'true' && inputs.apply_scope == 'datadog'
        run: terraform apply -input=false /tmp/platform.tfplan
        working-directory: infra
      - name: Apply exact saved GKE capacity plan
        if: inputs.confirm_cloud_apply == 'true' && inputs.apply_scope == 'gke_capacity'
        run: terraform apply -input=false /tmp/platform.tfplan
        working-directory: infra
      - name: Remove sensitive temporary plan
        if: always()
        run: rm -f /tmp/platform.tfplan /tmp/platform-plan.json
