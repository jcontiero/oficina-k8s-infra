name: Terraform Deploy

on:
  push:
    branches:
      - homolog
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-k8s-infra-shared
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform Plan (Shared Platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1064199753061/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@pos-fiap-2026.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Select Canonical Shared Workspace
        run: terraform workspace select main || terraform workspace new main
        working-directory: infra

      - name: Terraform Plan
        env:
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
        run: terraform plan -var-file="environments/main.tfvars"
        working-directory: infra

  apply:
    name: Terraform Apply (Production Shared Platform)
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1064199753061/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@pos-fiap-2026.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Select Canonical Shared Workspace
        run: terraform workspace select main || terraform workspace new main
        working-directory: infra

      - name: Terraform Apply
        env:
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
        run: terraform apply -auto-approve -var-file="environments/main.tfvars"
        working-directory: infra
