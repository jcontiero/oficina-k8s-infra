name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_cloud_apply:
        description: "Digite 'true' para autorizar o terraform apply na plataforma compartilhada (GCP)"
        required: true
        default: "false"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-k8s-infra-shared
  cancel-in-progress: false

jobs:
  plan:
    name: Datadog Plan and Apply
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/936717667971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@fiap-project-514922.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Plan
        env:
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
        run: terraform plan -input=false -var-file="environments/main.tfvars" -target=module.datadog -out=/tmp/datadog.tfplan
        working-directory: infra

      - name: Verify limited scope
        working-directory: infra
        run: |
          terraform show -json /tmp/datadog.tfplan > /tmp/datadog-plan.json
          python - <<'PYTHON'
          import json
          with open('/tmp/datadog-plan.json') as source:
              changes = json.load(source).get('resource_changes', [])
          for change in changes:
              actions = change['change']['actions']
              if actions in [['no-op'], ['read']]:
                  continue
              address = change['address']
              if not address.startswith('module.datadog.') or 'delete' in actions:
                  raise SystemExit(f'Alteração fora do escopo: {address} {actions}')
              print(address, actions)
          PYTHON
      - name: Apply exact saved Datadog plan
        if: inputs.confirm_cloud_apply == 'true'
        run: terraform apply -input=false /tmp/datadog.tfplan
        working-directory: infra
      - name: Remove sensitive temporary plan
        if: always()
        run: rm -f /tmp/datadog.tfplan /tmp/datadog-plan.json
